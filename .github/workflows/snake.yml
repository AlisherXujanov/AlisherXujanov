name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate github-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: AlisherXujanov
          outputs: |
            dist/github-snake.svg?color_snake=#00f2ea&color_dots=#161b22,#0e4d5c,#14919b,#00c2cb,#00f2ea
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00f2ea

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
